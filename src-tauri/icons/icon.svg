<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="KyberFood Desktop">
  <title>KyberFood Desktop</title>
  <!--
    Logo do app de IMPRESSÃO (comandas). É a marca que o lojista vê na barra de
    tarefas e na bandeja, quase sempre em 32x32 ou 16x16 — por isso são poucas
    formas grandes, e nenhum detalhe fino: uma comanda saindo da impressora, com
    o K da KyberFood.

    Cores da marca (tailwind.config.cjs): laranja #FF6B35 (primária),
    azul #1B2A4A (secundária) e verde #25D366 (o LED "conectado", que é
    justamente o estado que este app existe para manter).

    O K é AZUL sobre a comanda branca, e não laranja como no ícone anterior: a
    32x32 (o tamanho da bandeja, onde este app passa o dia) o K laranja some
    contra o branco e a logo vira uma mancha só com o corpo da impressora. O
    laranja da marca fica na maior massa de cor, que é a própria impressora.

    ARQUIVO-FONTE: os PNG e o ICO de icons/ e o public/icon.png são GERADOS deste
    SVG por `npm run desktop:icons` (scripts/generate-desktop-icons.mjs, no
    monorepo). Mexeu aqui e não rodou, o instalador sai com a logo ANTIGA e nada
    acusa — por isso existe o carimbo icons/.generated.json e a trava
    src/lib/desktop-icons.test.ts.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263C66"/>
      <stop offset="1" stop-color="#16233E"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#F2551B"/>
    </linearGradient>
  </defs>

  <!-- Ladrilho -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- Comanda: borda superior SERRILHADA (papel destacado da bobina) -->
  <path fill="#FFFFFF" d="M156 70 L176 48 L196 70 L216 48 L236 70 L256 48 L276 70 L296 48 L316 70 L336 48 L356 70 L356 316 L156 316 Z"/>

  <!-- K da marca, impresso na comanda -->
  <g fill="none" stroke="#16233E" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M209 116 L209 244"/>
    <path d="M300 116 L215 180 L304 244"/>
  </g>

  <!-- Corpo da impressora (cobre a base da comanda: ela sai de dentro) -->
  <rect x="88" y="288" width="336" height="158" rx="34" fill="url(#body)"/>
  <!-- Boca de saída do papel -->
  <rect x="134" y="284" width="244" height="26" rx="13" fill="#16233E"/>
  <!-- Bandeja frontal -->
  <rect x="120" y="350" width="196" height="52" rx="26" fill="#FFFFFF" opacity="0.24"/>
  <!-- LED de conectado -->
  <circle cx="370" cy="376" r="18" fill="#25D366"/>
</svg>
